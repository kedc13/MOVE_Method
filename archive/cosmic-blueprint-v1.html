    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0b1a; --surface: #13102b; --surface2: #1a1635; --surface3: #221d42;
      --border: rgba(139,92,246,0.18); --border-strong: rgba(139,92,246,0.35);
      --text: #e8e4ff; --text-muted: #8b82b8;
      --accent: #7c3aed; --accent-light: #a78bfa;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Lato', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse at 15% 20%, rgba(99,66,246,0.12) 0%, transparent 55%),
                  radial-gradient(ellipse at 85% 75%, rgba(139,92,246,0.08) 0%, transparent 55%);
    }
    .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--dur,3s) ease-in-out infinite var(--delay,0s); }
    @keyframes twinkle { 0%,100%{opacity:var(--min-op,0.2)} 50%{opacity:var(--max-op,0.8)} }
    .page-wrap { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
    .header { text-align: center; margin-bottom: 2.5rem; }
    .header-icon { font-size: 36px; display: block; margin-bottom: 0.75rem; animation: float 4s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    h1 { font-family:'Cinzel',serif; font-size:32px; font-weight:600; letter-spacing:0.08em; background:linear-gradient(135deg,#c4b5fd,#a78bfa,#818cf8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:0.5rem; }
    .header-sub { font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-muted); }
    .pips { display:flex; gap:8px; justify-content:center; margin-bottom:2.5rem; }
    .pip { width:36px; height:4px; border-radius:2px; background:var(--surface3); transition:background 0.4s; }
    .pip.active { background:var(--accent); }
    .pip.done { background:var(--accent-light); }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:1.75rem; margin-bottom:1.25rem; position:relative; }
    .card::before { content:''; position:absolute; inset:0; border-radius:20px; background:linear-gradient(135deg,rgba(139,92,246,0.05) 0%,transparent 60%); pointer-events:none; }
    .card-label { font-family:'Cinzel',serif; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent-light); margin-bottom:1rem; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .field-group { display:flex; flex-direction:column; gap:7px; }
    .field-group label { font-size:12px; color:var(--text-muted); letter-spacing:0.05em; }
    .field-group input { background:var(--surface2); border:1px solid var(--border-strong); border-radius:10px; padding:10px 14px; font-size:14px; font-family:'Lato',sans-serif; color:var(--text); width:100%; transition:border-color 0.2s,box-shadow 0.2s; color-scheme:dark; }
    .field-group input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(124,58,237,0.2); }
    .field-group input::placeholder { color:var(--text-muted); }
    .city-status { font-size:11px; margin-top:6px; min-height:16px; display:block; transition:color 0.2s; }
    .city-status.found { color:#34d399; }
    .city-status.err { color:#f87171; }
    .city-status.loading { color:var(--text-muted); }
    .suggestions { position:absolute; top:100%; left:0; right:0; background:var(--surface2); border:1px solid var(--border-strong); border-radius:10px; margin-top:4px; z-index:100; overflow:hidden; display:none; }
    .suggestion-item { padding:10px 14px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--border); transition:background 0.15s; }
    .suggestion-item:last-child { border-bottom:none; }
    .suggestion-item:hover { background:var(--surface3); color:var(--accent-light); }
    .city-wrap { position:relative; }
    .cta-btn { width:100%; padding:14px; border-radius:14px; border:none; background:linear-gradient(135deg,#5b21b6,#7c3aed,#6d28d9); color:white; font-family:'Cinzel',serif; font-size:15px; letter-spacing:0.07em; cursor:pointer; transition:opacity 0.2s,transform 0.15s; margin-top:0.5rem; position:relative; overflow:hidden; }
    .cta-btn::after { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,0.08) 0%,transparent 60%); }
    .cta-btn:hover:not(:disabled) { opacity:0.9; transform:translateY(-1px); }
    .cta-btn:active:not(:disabled) { transform:scale(0.98); }
    .cta-btn:disabled { opacity:0.4; cursor:not-allowed; }
    .error-msg { margin-top:12px; padding:10px 14px; background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.3); border-radius:10px; color:#f87171; font-size:13px; text-align:center; }
    .sign-trio { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:1.5rem; }
    .sign-card { border-radius:18px; padding:1.2rem 0.8rem; text-align:center; border:1px solid; }
    .sign-card.sun { background:rgba(245,158,11,0.1); border-color:rgba(245,158,11,0.4); }
    .sign-card.moon { background:rgba(139,92,246,0.1); border-color:rgba(139,92,246,0.4); }
    .sign-card.rising { background:rgba(16,185,129,0.1); border-color:rgba(16,185,129,0.4); }
    .sign-card .role { font-size:9px; letter-spacing:0.12em; text-transform:uppercase; font-weight:700; margin-bottom:6px; }
    .sign-card.sun .role { color:#fbbf24; }
    .sign-card.moon .role { color:#c4b5fd; }
    .sign-card.rising .role { color:#6ee7b7; }
    .sign-glyph { font-size:30px; margin-bottom:6px; display:block; }
    .sign-name { font-family:'Cinzel',serif; font-size:13px; font-weight:600; color:var(--text); margin-bottom:8px; }
    .chakra-badge { display:inline-block; font-size:10px; padding:3px 9px; border-radius:20px; font-weight:700; letter-spacing:0.04em; }
    .insight-box { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:1.25rem 1.3rem; margin-bottom:1rem; }
    .section-title { font-family:'Cinzel',serif; font-size:13px; letter-spacing:0.06em; color:var(--accent-light); margin-bottom:0.85rem; }
    .insight-text { font-size:14px; line-height:1.8; color:var(--text); }
    .balance-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
    .balance-item { border-radius:12px; padding:11px 13px; border:1px solid; }
    .balance-item.in { border-color:rgba(16,185,129,0.35); background:rgba(16,185,129,0.08); }
    .balance-item.out { border-color:rgba(239,68,68,0.35); background:rgba(239,68,68,0.08); }
    .b-title { font-size:10px; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; margin-bottom:5px; }
    .balance-item.in .b-title { color:#34d399; }
    .balance-item.out .b-title { color:#f87171; }
    .b-text { font-size:12px; line-height:1.55; color:var(--text-muted); }
    .tools-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
    .tool-tag { font-size:11px; padding:4px 10px; border-radius:20px; background:rgba(139,92,246,0.15); color:var(--accent-light); border:1px solid rgba(139,92,246,0.3); font-weight:500; }
    .season-flow { display:flex; flex-direction:column; gap:8px; }
    .season-item { display:flex; align-items:flex-start; gap:12px; padding:11px 13px; background:var(--surface2); border-radius:12px; border:1px solid var(--border); }
    .season-dot { width:10px; height:10px; border-radius:50%; margin-top:4px; flex-shrink:0; }
    .season-name { font-size:12px; font-weight:700; color:var(--text); }
    .season-desc { font-size:12px; color:var(--text-muted); line-height:1.5; margin-top:2px; }
    .truth-box { background:linear-gradient(135deg,rgba(99,66,246,0.15),rgba(99,102,241,0.1)); border:1px solid rgba(139,92,246,0.4); border-radius:18px; padding:1.5rem; margin-bottom:1.25rem; text-align:center; }
    .truth-title { font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.14em; color:var(--accent-light); margin-bottom:10px; }

    .ai-loading { text-align:center; padding:3rem; color:var(--text-muted); font-size:15px; font-family:'Cinzel',serif; letter-spacing:0.06em; animation:pulse 1.8s ease-in-out infinite; }

    <div class="footer">Cosmic Blueprint · Chakra Astrology Guide</div>

let geoCache = null, geoTimer = null;

function onCityInput() {
  clearTimeout(geoTimer);
  const v = document.getElementById('bcity').value.trim();
  const st = document.getElementById('cityStatus');
  const sg = document.getElementById('suggestions');
  geoCache = null;
  if(v.length < 2){ sg.style.display='none'; st.textContent=''; st.className='city-status'; return; }
  const matches = searchCities(v);
  if(matches.length) {
    showSuggestions(matches);
    st.textContent=''; st.className='city-status';
  } else {
    sg.style.display='none';
    st.textContent='City not found — try another spelling or nearby city'; st.className='city-status err';
  }
}

function onCityKey(e) {
  if(e.key==='Escape') document.getElementById('suggestions').style.display='none';
}

function searchCities(q) {
  const lower = q.toLowerCase().replace(/[,\.]/g,' ').trim();
  const words = lower.split(/\s+/).filter(Boolean);
  const results = [];
  for(const c of CITIES) {
    const name = c[0].toLowerCase();
    let score = 0;
    for(const w of words) { if(name.includes(w)) score++; }
    if(score === words.length) results.push({city:c, score, startsWith: name.startsWith(lower)});
  }
  results.sort((a,b)=>(b.startsWith-a.startsWith)||b.score-a.score);
  return results.slice(0,6);
}

function showSuggestions(matches) {
  const sg = document.getElementById('suggestions');
  sg.innerHTML = matches.map((m,i)=>`<div class="suggestion-item" onclick="selectCity(${CITIES.indexOf(m.city)})">${m.city[0]}</div>`).join('');
  sg.style.display = 'block';
}

function selectCity(idx) {
  const c = CITIES[idx];
  geoCache = { name:c[0], lat:c[1], lon:c[2], tz:c[3] };
  document.getElementById('bcity').value = c[0];
  document.getElementById('suggestions').style.display = 'none';
  document.getElementById('cityStatus').textContent = '✓ ' + c[0];
  document.getElementById('cityStatus').className = 'city-status found';
}

function getSunSign(month, day) {
  const cuts=[20,19,21,20,21,21,23,23,23,23,22,22];
  const SIGNS=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
  return day>=cuts[month-1]?SIGNS[month-1]:SIGNS[(month+10)%12];
}

const SIGNS=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];

function julianDay(year,month,day,hourUTC){
  if(month<=2){year--;month+=12;}
  const A=Math.floor(year/100),B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(year+4716))+Math.floor(30.6001*(month+1))+day+B-1524.5+hourUTC/24;
}

function moonLongitude(jd){
  const T=(jd-2451545.0)/36525;
  let L=218.3164477+481267.88123421*T-0.0015786*T*T+T*T*T/538841-T*T*T*T/65194000;
  const M =(357.5291092+35999.0502909*T-0.0001536*T*T+T*T*T/24490000)*Math.PI/180;
  const Mp=(134.9633964+477198.8675055*T+0.0087414*T*T+T*T*T/69699-T*T*T*T/14712000)*Math.PI/180;
  const D =(297.8501921+445267.1114034*T-0.0018819*T*T+T*T*T/545868-T*T*T*T/113065000)*Math.PI/180;
  const F =(93.2720950+483202.0175233*T-0.0036539*T*T-T*T*T/3526000+T*T*T*T/863310000)*Math.PI/180;
  const dL=6288774*Math.sin(Mp)+1274027*Math.sin(2*D-Mp)+658314*Math.sin(2*D)+213618*Math.sin(2*Mp)
    -185116*Math.sin(M)-114332*Math.sin(2*F)+58793*Math.sin(2*D-2*Mp)+57066*Math.sin(2*D-M-Mp)
    +53322*Math.sin(2*D+Mp)+45758*Math.sin(2*D-M)-40923*Math.sin(M-Mp)-34720*Math.sin(D)
    -30383*Math.sin(M+Mp)+15327*Math.sin(2*D-2*F)-12528*Math.sin(Mp+2*F)+10980*Math.sin(Mp-2*F)
    +10675*Math.sin(4*D-Mp)+10034*Math.sin(3*Mp)+8548*Math.sin(4*D-2*Mp)-7888*Math.sin(2*D+M-Mp)
    -6766*Math.sin(2*D+M)-5163*Math.sin(D-Mp);
  return (((L+dL/1000000)%360)+360)%360;
}

function getMoonSign(year,month,day,hourUTC){
  return SIGNS[Math.floor(moonLongitude(julianDay(year,month,day,hourUTC))/30)];
}

function getRisingSign(year,month,day,hourUTC,latDeg,lonDeg){
  const jd=julianDay(year,month,day,hourUTC);
  const T=(jd-2451545.0)/36525;
  let theta=280.46061837+360.98564736629*(jd-2451545)+0.000387933*T*T-T*T*T/38710000;
  let lst=(((theta+lonDeg)%360)+360)%360;
  const lat=latDeg*Math.PI/180, eps=23.4392911*Math.PI/180, ra=lst*Math.PI/180;
  let asc=Math.atan2(-Math.cos(ra), Math.sin(ra)*Math.cos(eps)+Math.tan(lat)*Math.sin(eps))*180/Math.PI;
  return SIGNS[Math.floor((((asc%360)+360)%360)/30)];
}

function getTzOffsetHours(tzName,dateStr){
  try{
    const d=new Date(dateStr+'T12:00:00');
    const local=new Date(d.toLocaleString('en-US',{timeZone:tzName}));
    const utc=new Date(d.toLocaleString('en-US',{timeZone:'UTC'}));
    return (local-utc)/3600000;
  }catch(e){return 0;}
}

async function calculate(){
  document.getElementById('errMsg').innerHTML='';
  const bdate=document.getElementById('bdate').value;
  const btime=document.getElementById('btime').value;
  if(!bdate){showErr('Enter your date of birth.');return;}
  if(!btime){showErr('Birth time is needed for accurate Moon and Rising signs.');return;}
  if(!geoCache){showErr('Please type your city and select it from the dropdown list.');return;}
  const btn=document.getElementById('calcBtn');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Calculating your blueprint...';
  const [yr,mo,dy]=bdate.split('-').map(Number);
  const [hr,mn]=btime.split(':').map(Number);
  const localHour=hr+mn/60;
  const tzOffset=getTzOffsetHours(geoCache.tz,bdate);
  let utcHour=localHour-tzOffset, utcDay=dy, utcMo=mo, utcYr=yr;
  if(utcHour<0){utcHour+=24;utcDay--;if(utcDay<1){utcMo--;if(utcMo<1){utcMo=12;utcYr--;}utcDay=new Date(utcYr,utcMo,0).getDate();}}
  if(utcHour>=24){utcHour-=24;utcDay++;const dim=new Date(utcYr,utcMo,0).getDate();if(utcDay>dim){utcDay=1;utcMo++;if(utcMo>12){utcMo=1;utcYr++;}}}
  const sun=getSunSign(mo,dy);
  const moon=getMoonSign(utcYr,utcMo,utcDay,utcHour);
  const rising=getRisingSign(utcYr,utcMo,utcDay,utcHour,geoCache.lat,geoCache.lon);
  document.getElementById('step0').style.display='none';
  document.getElementById('step1').style.display='block';
  setPips(1);
  document.getElementById('locationPill').innerHTML=`<span class="loc-pill">✦ ${geoCache.name} · ${geoCache.lat.toFixed(2)}°, ${geoCache.lon.toFixed(2)}°</span>`;
  document.getElementById('signTrio').innerHTML=signCardHTML(sun,'Sun Sign','sun')+signCardHTML(moon,'Moon Sign','moon')+signCardHTML(rising,'Rising Sign','rising');
  await loadAI(sun,moon,rising,geoCache.name);
  btn.disabled=false; btn.innerHTML='✦ Reveal My Cosmic Blueprint ✦';
}

  const sd=SIGN_DATA[sun],md=SIGN_DATA[moon],rd=SIGN_DATA[rising];
  const prompt=`You are a mystical chakra astrology guide. A client was born in ${city}.
Sun: ${sun} (${sd.chakra} Chakra) — core survival gifts and identity.
Moon: ${moon} (${md.chakra} Chakra) — soul purpose and what helps them thrive.
Rising: ${rising} (${rd.chakra} Chakra) — how they meet the world and move through seasons.
Respond ONLY with valid JSON (no markdown, no preamble):
{"sunGift":"2-3 sentences on their core survival gift through the ${sd.chakra} Chakra as a ${sun}","sunInBalance":"3 specific signs of being in balance","sunOutBalance":"3 specific signs of being out of balance","moonPurpose":"2-3 sentences on soul purpose and what makes them thrive (Moon in ${moon})","moonThrive":"3 specific practices or environments where they flourish","risingFlow":"2 sentences on how they move through the world (Rising ${rising})","seasonalWisdom":[{"season":"Sun in ${sun}","color":"#f59e0b","guidance":"one sentence on this seasonal activation"},{"season":"Sun in ${moon}","color":"#a78bfa","guidance":"one sentence on Moon-season activation"},{"season":"Sun in ${rising}","color":"#34d399","guidance":"one sentence on Rising-season activation"}],"integratedMessage":"2-3 sentences weaving all three signs into a unified message about who this person is"}`;

    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:prompt}]})});

    const text=data.content.map(b=>b.text||'').join('');

    renderReading(sun,moon,rising,ai);

}
