    .header-sub { font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-muted); }
    .pips { display:flex; gap:8px; justify-content:center; margin-bottom:2.5rem; }
    .pip { width:36px; height:4px; border-radius:2px; background:var(--surface3); transition:background 0.4s; }

    .field-group input { background:var(--surface2); border:1px solid var(--border-strong); border-radius:10px;

    .suggestions { position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--surface2);

    .sug-item:hover, .sug-item.hi { background:var(--surface3); }
    .sug-main { color:var(--text); font-weight:500; }
    .sug-sub { color:var(--text-muted); font-size:11px; margin-top:1px; }
    .loc-status { font-size:11px; margin-top:6px; min-height:16px; display:block; }
    .loc-status.ok { color:#34d399; } .loc-status.err { color:#f87171; } .loc-status.busy { color:var(--text-muted); }
    .manual-toggle { font-size:11px; color:var(--accent-light); cursor:pointer; margin-top:8px; display:inline-block; }

// ── Search logic ──────────────────────────────────────────────────────────────
let geoCache = null, debounce = null, results = [], hiIdx = -1;

function onLocInput() {
  clearTimeout(debounce);
  const v = document.getElementById('locInput').value.trim();
  geoCache = null;
  setSt('', '');
  if (v.length < 2) { hideSugs(); return; }
  debounce = setTimeout(() => doSearch(v), 200);
}

function doSearch(q) {
  const clean = q.toLowerCase().replace(/[.,]/g,' ').trim();

  // 1. Zip code exact match
  if (/^\d{5}$/.test(clean) && ZIPS[clean]) {
    const z = ZIPS[clean];
    results = [{ name:`${z[2]}, ${z[3]}`, detail:`Zip ${clean}`, lat:z[0], lon:z[1], tz:z[4] }];
    showSugs(); return;
  }

  // 2. Fuzzy DB search — score each entry
  const words = clean.split(/\s+/).filter(Boolean);
  const scored = [];
  for (const row of DB) {
    const n = row[0].toLowerCase();
    let score = 0;
    for (const w of words) { if (n.includes(w)) score += w.length; }
    if (score > 0) scored.push({ name:row[0], detail:'', lat:row[1], lon:row[2], tz:row[3], score, exact: n.startsWith(clean) });
  }
  scored.sort((a,b) => (b.exact - a.exact) || (b.score - a.score));
  results = scored.slice(0,8);

  if (results.length) { showSugs(); setSt('',''); }
  else { hideSugs(); setSt('Not found — try spelling it differently, or use a nearby larger city', 'err'); }
}

function showSugs() {
  const box = document.getElementById('sugs');
  hiIdx = -1;
  box.innerHTML = results.map((r,i)=>
    `<div class="sug-item" onclick="pickResult(${i})">
      <div class="sug-main">${r.name}</div>
      ${r.detail ? `<div class="sug-sub">${r.detail}</div>` : ''}
    </div>`).join('');
  box.style.display = 'block';
}

function hideSugs() { document.getElementById('sugs').style.display='none'; hiIdx=-1; }

function pickResult(i) {
  const r = results[i];
  geoCache = { name:r.name, lat:r.lat, lon:r.lon, tz:r.tz };
  document.getElementById('locInput').value = r.name;
  hideSugs();
  setSt(`✓ ${r.name} · ${r.lat.toFixed(2)}°, ${r.lon.toFixed(2)}°`, 'ok');
}

function onLocKey(e) {
  const items = document.querySelectorAll('.sug-item');
  if (!items.length) return;
  if (e.key==='ArrowDown') { e.preventDefault(); hiIdx=Math.min(hiIdx+1,items.length-1); highlight(items); }
  else if (e.key==='ArrowUp') { e.preventDefault(); hiIdx=Math.max(hiIdx-1,0); highlight(items); }
  else if (e.key==='Enter' && hiIdx>=0) { e.preventDefault(); pickResult(hiIdx); }
  else if (e.key==='Escape') hideSugs();
}
function highlight(items) { items.forEach((el,i)=>el.classList.toggle('hi',i===hiIdx)); }

document.addEventListener('click', e => { if(!e.target.closest('.loc-wrap')) hideSugs(); });

function setSt(msg, cls) {
  const el = document.getElementById('locSt');
  el.textContent = msg; el.className = 'loc-status' + (cls?' '+cls:'');
}

function toggleManual() {
  const d = document.getElementById('manualCoords');
  d.classList.toggle('open');
}

function useManual() {

const SIGNS=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];

function getSunSign(m,d){const c=[20,19,21,20,21,21,23,23,23,23,22,22];return d>=c[m-1]?SIGNS[m-1]:SIGNS[(m+10)%12];}

function jd(yr,mo,dy,h){if(mo<=2){yr--;mo+=12;}const A=Math.floor(yr/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(yr+4716))+Math.floor(30.6001*(mo+1))+dy+B-1524.5+h/24;}

function moonLon(j){
  const T=(j-2451545)/36525;
  let L=218.3164477+481267.88123421*T-0.0015786*T*T+T*T*T/538841-T*T*T*T/65194000;
  const M=(357.5291092+35999.0502909*T)*Math.PI/180;
  const Mp=(134.9633964+477198.8675055*T+0.0087414*T*T)*Math.PI/180;
  const D=(297.8501921+445267.1114034*T-0.0018819*T*T)*Math.PI/180;
  const F=(93.2720950+483202.0175233*T-0.0036539*T*T)*Math.PI/180;
  const dL=6288774*Math.sin(Mp)+1274027*Math.sin(2*D-Mp)+658314*Math.sin(2*D)+213618*Math.sin(2*Mp)
    -185116*Math.sin(M)-114332*Math.sin(2*F)+58793*Math.sin(2*D-2*Mp)+57066*Math.sin(2*D-M-Mp)
    +53322*Math.sin(2*D+Mp)+45758*Math.sin(2*D-M)-40923*Math.sin(M-Mp)-34720*Math.sin(D)
    -30383*Math.sin(M+Mp)+15327*Math.sin(2*D-2*F)-12528*Math.sin(Mp+2*F)+10980*Math.sin(Mp-2*F)
    +10675*Math.sin(4*D-Mp)+10034*Math.sin(3*Mp)+8548*Math.sin(4*D-2*Mp)-7888*Math.sin(2*D+M-Mp)
    -6766*Math.sin(2*D+M)-5163*Math.sin(D-Mp);
  return(((L+dL/1e6)%360)+360)%360;
}

function getMoonSign(yr,mo,dy,h){return SIGNS[Math.floor(moonLon(jd(yr,mo,dy,h))/30)];}

function getRising(yr,mo,dy,h,lat,lon){
  var J=jd(yr,mo,dy,h),T=(J-2451545.0)/36525;
  var GMST=280.46061837+360.98564736629*(J-2451545)+0.000387933*T*T-T*T*T/38710000;
  var LST=((GMST+lon)%360+360)%360;
  var eps=23.4392911*Math.PI/180, la=lat*Math.PI/180;
  function lstForLam(d){
    var r=d*Math.PI/180;
    var RA=((Math.atan2(Math.sin(r)*Math.cos(eps),Math.cos(r)))*180/Math.PI+360)%360;
    var Dec=Math.asin(Math.sin(r)*Math.sin(eps));
    var c=-Math.tan(la)*Math.tan(Dec);
    if(Math.abs(c)>1)return null;
    return ((RA-Math.acos(c)*180/Math.PI)%360+360)%360;
  }
  function cd(a,b){var d=(a-b+360)%360;return d<=180?d:d-360;}
  var lo=0,hi=360;
  for(var i=0;i<60;i++){
    var mid=(lo+hi)/2,lLo=lstForLam(lo),lMid=lstForLam(mid);
    if(lLo===null||lMid===null){lo=mid;continue;}
    if(cd(LST,lLo)*cd(LST,lMid)<0)hi=mid; else lo=mid;
  }
  return SIGNS[Math.floor(((lo+hi)/2)/30)%12];
}

function getTzOff(tz,ds){
  try{const d=new Date(ds+'T12:00:00'),l=new Date(d.toLocaleString('en-US',{timeZone:tz})),u=new Date(d.toLocaleString('en-US',{timeZone:'UTC'}));return(l-u)/3600000;}
  catch(e){const m=tz.match(/Etc\/GMT([+-])(\d+)/);if(m)return(m[1]==='-'?1:-1)*+m[2];return 0;}
}

    <div class="tools-list">${sd.tools.split(',').map(t=>`<span class="tool-tag">${t.trim()}</span>`).join('')}</div></div></div>
    <div class="insight-box"><div class="section-title">🌙 Moon in ${moon} — Your Purpose</div>
    <p class="insight-text">${ai.moonPurpose}</p>
    <p style="font-size:13px;color:var(--text-muted);line-height:1.75;margin-top:12px">${ai.moonThrive}</p></div>
    <div class="insight-box"><div class="section-title">⬆ Rising ${rising} — Your Seasonal Flow</div>
    <p class="insight-text">${ai.risingFlow}</p></div>
    <div class="insight-box"><div class="section-title">🌀 Seasonal Activations</div>
    <div class="season-flow">${ai.seasonalWisdom.map(s=>`<div class="season-item"><div class="season-dot" style="background:${s.color}"></div><div><div class="season-name">${s.season}</div><div class="season-desc">${s.guidance}</div></div></div>`).join('')}</div></div>
    <div class="truth-box"><div class="truth-title">✦ Your Integrated Truth ✦</div>
    <p class="truth-text">${ai.integratedMessage}</p></div>`;
  setPips(2);
}

function renderFallback(sun,moon,rising){
  document.getElementById('aiContent').innerHTML=`
    <div class="insight-box"><div class="section-title">☀️ Sun in ${sun} — ${SD[sun].chakra} Chakra</div>
    <div class="tools-list">${SD[sun].tools.split(',').map(t=>`<span class="tool-tag">${t.trim()}</span>`).join('')}</div></div>
    <div class="insight-box"><div class="section-title">🌙 Moon in ${moon}</div>
    <p class="insight-text">Your ${SD[moon].chakra} Chakra Moon guides your emotional truth and soul path.</p></div>
    <div class="insight-box"><div class="section-title">⬆ Rising ${rising}</div>
    <p class="insight-text">Your ${SD[rising].chakra} Chakra Rising shapes how you enter each new season.</p></div>`;
  setPips(2);
}
</script>
